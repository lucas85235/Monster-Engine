name: CI Build

on:
  push:
    branches: [main, dev, feature/*]
  pull_request:
    branches: [main, dev]

jobs:
  build-windows:
    name: Windows Build
    runs-on: windows-2022
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Setup dependencies
        run: python scripts/setup.py
      
      - name: Build Release
        run: python scripts/build.py Release demo_test
      
      - name: Create distribution
        run: |
          $GAME_NAME = "DemoTest"
          $DIST_DIR = "dist/$GAME_NAME"
          
          # Create distribution directory
          New-Item -ItemType Directory -Force -Path $DIST_DIR
          
          # Copy executable
          Copy-Item "build/apps/demo_test/Release/*.exe" -Destination $DIST_DIR -Force
          
          # Copy DLLs if any
          $dlls = Get-ChildItem "build/apps/demo_test/Release/*.dll" -ErrorAction SilentlyContinue
          if ($dlls) {
            Copy-Item $dlls -Destination $DIST_DIR -Force
          }
          
          # Copy assets
          if (Test-Path "assets") {
            Copy-Item "assets" -Destination "$DIST_DIR/assets" -Recurse -Force
          }
      
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DemoTest-Windows
          path: dist/DemoTest
          if-no-files-found: error

  build-linux:
    name: Linux Build
    runs-on: ubuntu-24.04
    
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1G
      CCACHE_COMPRESS: "true"
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: python scripts/setup.py
      
      - name: Install ccache
        run: sudo apt install -y ccache
      
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: linux-ccache-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            linux-ccache-${{ github.ref_name }}-
            linux-ccache-dev-
            linux-ccache-
      
      - name: Build Release
        run: python scripts/build.py Release demo_test
      
      - name: Create distribution
        run: |
          GAME_NAME="DemoTest"
          DIST_DIR="dist/$GAME_NAME"
          
          # Create distribution directories
          mkdir -p "$DIST_DIR/lib"
          
          # Copy executable
          cp build/apps/demo_test/demo_test "$DIST_DIR/"
          
          # Copy all required shared libraries using ldd
          echo "Copying shared libraries..."
          ldd build/apps/demo_test/demo_test | grep "=>" | awk '{print $3}' | while read lib; do
            if [ -f "$lib" ]; then
              case "$lib" in
                */libc++*|*/libunwind*|*/libgcc_s*|*/libstdc++*)
                  echo "  Copying: $lib"
                  cp "$lib" "$DIST_DIR/lib/" 2>/dev/null || true
                  ;;
              esac
            fi
          done
          
          # Also copy these explicitly in case ldd misses them
          for lib in libc++.so.1 libc++abi.so.1 libunwind.so.1; do
            if [ -f "/usr/lib/x86_64-linux-gnu/$lib" ]; then
              cp "/usr/lib/x86_64-linux-gnu/$lib" "$DIST_DIR/lib/" 2>/dev/null || true
            fi
          done
          
          # Create launcher script
          cat > "$DIST_DIR/run.sh" << 'LAUNCHER'
          #!/bin/bash
          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          export LD_LIBRARY_PATH="$SCRIPT_DIR/lib:$LD_LIBRARY_PATH"
          exec "$SCRIPT_DIR/demo_test" "$@"
          LAUNCHER
          chmod +x "$DIST_DIR/run.sh"
          
          # List bundled libraries
          echo "Bundled libraries:"
          ls -la "$DIST_DIR/lib/"
          
          # Copy assets
          if [ -d "assets" ]; then
            cp -r assets "$DIST_DIR/"
          fi
      
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DemoTest-Linux
          path: dist/DemoTest
          if-no-files-found: error

