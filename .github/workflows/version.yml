name: Auto Version

on:
  push:
    branches: [dev]

permissions:
  contents: write

jobs:
  version:
    name: Auto Version Bump
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Get current version
        id: current
        run: |
          VERSION=$(cat ENGINE_VERSION)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $VERSION"
      
      - name: Analyze commits for version bump
        id: bump
        run: |
          # Get commits since last tag or all commits if no tag exists
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          
          if [ -z "$LAST_TAG" ]; then
            COMMITS=$(git log --oneline --format="%s")
          else
            COMMITS=$(git log ${LAST_TAG}..HEAD --oneline --format="%s")
          fi
          
          echo "Commits to analyze:"
          echo "$COMMITS"
          
          # Determine bump type
          BUMP_TYPE="none"
          
          if echo "$COMMITS" | grep -qiE "^(feat|feature)!:|BREAKING CHANGE:"; then
            BUMP_TYPE="major"
          elif echo "$COMMITS" | grep -qiE "^(feat|feature):"; then
            BUMP_TYPE="minor"
          elif echo "$COMMITS" | grep -qiE "^fix:|^perf:|^refactor:"; then
            BUMP_TYPE="patch"
          fi
          
          echo "bump_type=$BUMP_TYPE" >> $GITHUB_OUTPUT
          echo "Bump type: $BUMP_TYPE"
      
      - name: Calculate new version
        id: new
        if: steps.bump.outputs.bump_type != 'none'
        run: |
          VERSION="${{ steps.current.outputs.version }}"
          BUMP_TYPE="${{ steps.bump.outputs.bump_type }}"
          
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          
          case $BUMP_TYPE in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac
          
          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "New version: $NEW_VERSION"
      
      - name: Update ENGINE_VERSION file
        if: steps.bump.outputs.bump_type != 'none'
        run: |
          echo "${{ steps.new.outputs.new_version }}" > ENGINE_VERSION
      
      - name: Commit and tag
        if: steps.bump.outputs.bump_type != 'none'
        run: |
          NEW_VERSION="${{ steps.new.outputs.new_version }}"
          
          git add ENGINE_VERSION
          git commit -m "chore: bump version to ${NEW_VERSION} [skip ci]"
          git tag -a "v${NEW_VERSION}-dev" -m "Development version ${NEW_VERSION}"
          git push origin dev --follow-tags
          
          echo "✅ Version bumped to ${NEW_VERSION}"
